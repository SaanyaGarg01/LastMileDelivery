<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Register · Delivery Tracker</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="container login-wrap">
  <div class="card">
    <h1>Create your account</h1>
    <p class="muted">Customer registration — place orders and track deliveries.</p>
    <form id="regForm">
      <label>Full name</label>
      <input type="text" id="name" required />
      <label>Email</label>
      <input type="email" id="email" required />
      <label>Phone</label>
      <input type="text" id="phone" />
      <label>Password</label>
      <input type="password" id="password" required minlength="6" />
      <div style="margin-top:16px">
        <button class="btn" type="submit">Register</button>
      </div>
      <div id="err" class="error"></div>
    </form>
    <p class="hint" style="margin-top:16px">Already have an account? <a href="/pages/login.html">Sign in</a></p>
  </div>
</div>
<script src="/js/api.js"></script>
<script>
  document.getElementById('regForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('err');
    errEl.textContent = '';
    try {
      const data = await api('/auth/register', { method: 'POST', body: { name, email, phone, password }, auth: false });
      setSession(data);
      window.location.href = '/pages/customer.html';
    } catch (err) {
      errEl.textContent = err.message;
    }
  });
</script>
</body>
</html>
